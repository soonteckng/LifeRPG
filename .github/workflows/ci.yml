name: LifeRPG CI

on:
  pull_request:
    branches: [main, feature/offline-sessions]
  push:
    branches: [main, progression-foundation, feature/routines-widget, feature/protected-breaks]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests
        env:
          SESSION_SQL_PGLITE_ROOT: ${{ runner.temp }}/liferpg-sql/node_modules/@electric-sql/pglite
        run: |
          npm install --prefix "$RUNNER_TEMP/liferpg-sql" --no-save --ignore-scripts @electric-sql/pglite@0.5.8
          node --require ./tests/helpers/no-external-network.cjs --test --test-concurrency=4 tests/*.test.cjs

      - name: Lint the full repository
        run: npm run lint

  progression-sql:
    name: Progression SQL and concurrent completions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: liferpg_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: liferpg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liferpg_test -d liferpg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LIFERPG_DISPOSABLE_SQL: "YES"
      LIFERPG_TEST_DATABASE_URL: postgresql://liferpg_test:disposable_ci_only@localhost:5432/liferpg_test
    steps:
      - name: Download repository code
        uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate migration, history and access controls
        run: bash scripts/test-progression-postgres.sh
      - name: Validate simultaneous completion and retry
        run: bash scripts/test-progression-concurrency.sh
      - name: Validate focus catalogue replacement and account defaults
        run: bash scripts/test-focus-catalog-postgres.sh

  offline-sql:
    name: Offline SQL and concurrent reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: liferpg_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: liferpg_offline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liferpg_test -d liferpg_offline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SQL_DISPOSABLE_DATABASE: "1"
      SESSION_SQL_POSTGRES_URL: postgresql://liferpg_test:disposable_ci_only@localhost:5432/liferpg_offline_test
    steps:
      - name: Download repository code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Rehearse offline imports and reconciliation races in a fresh local database
        run: node tests/sql/session-offline-sync-concurrency.cjs

  routine-sql:
    name: Routine SQL and concurrent changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: liferpg_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: liferpg_routine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liferpg_test -d liferpg_routine_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESSION_SQL_DISPOSABLE_DATABASE: "1"
      SESSION_SQL_POSTGRES_URL: postgresql://liferpg_test:disposable_ci_only@localhost:5432/liferpg_routine_test
    steps:
      - name: Download repository code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Validate simultaneous routine changes and account binding in a fresh local database
        run: node tests/sql/saved-routines-concurrency.cjs
